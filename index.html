<!-- นี่คือโครงสร้างหน้าเว็บทังหมด -->
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>หน้าแนะนำตัวของฉัน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --navy-deep: #0b1642;
    --navy-base: #12205c;
    --navy-mid: #1a2f7a;
    --circuit-line: rgba(140, 180, 255, 0.16);
    --circuit-node: rgba(120, 200, 255, 0.35);
    --accent-cyan: #4fd1ff;
    --card-bg: #f7f9ff;
    --text-dark: #1b2340;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    color: var(--text-dark);
    font-family: "Sarabun", "Segoe UI", sans-serif;

    /* พื้นหลังไล่เฉดสีน้ำเงินเข้ม */
    background-color: var(--navy-deep);
    background-image:
      /* เส้นวงจร แนวนอน/แนวตั้ง แบบแผงวงจร */
      linear-gradient(var(--circuit-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--circuit-line) 1px, transparent 1px),
      /* จุดโหนดวงจรกระจายเป็นลวดลาย */
      radial-gradient(circle at 20% 30%, var(--circuit-node) 2px, transparent 3px),
      radial-gradient(circle at 70% 60%, var(--circuit-node) 2px, transparent 3px),
      radial-gradient(circle at 40% 80%, var(--circuit-node) 2px, transparent 3px),
      radial-gradient(circle at 85% 15%, var(--circuit-node) 2px, transparent 3px),
      /* แสงไล่เฉดให้มีมิติ */
      radial-gradient(ellipse at top left, var(--navy-mid), transparent 60%),
      radial-gradient(ellipse at bottom right, var(--navy-mid), transparent 60%),
      linear-gradient(160deg, var(--navy-deep), var(--navy-base));
    background-size:
      40px 40px,
      40px 40px,
      160px 160px,
      160px 160px,
      160px 160px,
      160px 160px,
      100% 100%,
      100% 100%,
      100% 100%;
    background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, no-repeat, no-repeat, no-repeat;
    background-attachment: fixed;
  }

  /* ===== แถบเมนูด้านบน ===== */
  .navbar {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 40px;
    padding: 24px 20px;
    background: linear-gradient(90deg, var(--navy-base), var(--navy-mid));
    border-bottom: 1px solid rgba(140, 180, 255, 0.25);
  }

  .navbar a {
    color: #fff;
    text-decoration: none;
    font-size: 20px;
    font-weight: 700;
  }

  .navbar a:hover {
    color: var(--accent-cyan);
  }

  .page-body {
    padding: 60px 20px 70px;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow:
      0 20px 50px rgba(5, 10, 40, 0.45),
      0 0 0 1px rgba(140, 180, 255, 0.15);
    max-width: 560px;
    margin: 0 auto;
    padding: 48px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  /* เส้นไฮไลต์ด้านบนของการ์ด อ้างอิงธีมวงจรไฟฟ้า */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 4px;
    background: linear-gradient(90deg, var(--navy-base), var(--accent-cyan), var(--navy-base));
  }

  .profile-photo {
    display: block;
    width: 200px;
    height: 200px;
    object-fit: cover;
    border-radius: 50%;
    margin: 0 auto 28px;
    border: 6px solid var(--accent-cyan);
    box-shadow: 0 0 0 4px rgba(79, 209, 255, 0.15);
  }

  h1.name-th {
    color: var(--navy-base);
    font-size: 30px;
    font-weight: 700;
    margin: 0 0 6px;
    letter-spacing: 0.3px;
  }

  .name-en {
    color: #6b7690;
    font-size: 18px;
    margin: 0 0 24px;
  }

  p {
    font-size: 18px;
    line-height: 1.7;
    margin: 14px 0;
    color: #3a4266;
  }

  p strong {
    color: var(--navy-base);
  }

  .cta-row {
    margin-top: 28px;
  }

  .cta-button {
    display: inline-block;
    padding: 12px 26px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    color: #fff;
    background: var(--navy-base);
    border: none;
    border-radius: 10px;
    text-decoration: none;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
  }

  .cta-button:hover {
    background: var(--navy-mid);
    transform: translateY(-1px);
  }
</style>
</head>
<body>

<nav class="navbar">
  <a href="index.html">หน้าหลัก</a>
  <a href="portfolio.html">Portfolio</a>
</nav>

<div class="page-body">
  <div class="card">
    <img src="images/profile.jpg" alt="รูปโปรไฟล์ของมนูญ" class="profile-photo">

    <h1 class="name-th">มนูญ มลิวัลย์</h1>
    <p class="name-en">Manoon Maliwan</p>

    <p>สวัสดีครับ ผมชื่อ <strong>มนูญ มลิวัลย์</strong></p>

    <p>ผมมีความสนใจในด้าน <strong>วิศวกรรมไฟฟ้า (Electrical Engineering)</strong> และมีความตั้งใจที่จะศึกษาต่อในสายวิศวกรรม</p>

    <div class="cta-row">
      <a class="cta-button" href="portfolio.html">👉 ดูแฟ้มสะสมงานของผม</a>
    </div>
  </div>
</div>

</body>
</html>
